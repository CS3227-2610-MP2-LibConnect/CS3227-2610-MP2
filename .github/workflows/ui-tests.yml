name: JavaFX UI tests

on:
  push:
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit and JavaFX UI tests
        run: xvfb-run --auto-servernum mvn -Pui-tests test
